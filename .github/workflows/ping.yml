name: Ping Server Keep-Alive

on:
  schedule:
    # Run every 14 minutes to prevent the free tier server from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -f https://postcards-and-little-footnotes.onrender.com/api/ping
