description = "Lightweight backend for Trip Moments PWA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.2.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false
